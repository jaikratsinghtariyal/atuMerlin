# =========================================================================
# ATU Merlin API - main configuration
# Everything an operator typically needs to change is externalised here and
# can be overridden with environment variables (Spring relaxed binding) or
# a --spring.config.import file, without recompiling.
# =========================================================================
spring:
  application:
    name: atu-merlin-api
  profiles:
    # Switch to "postgres" to run against PostgreSQL (see application-postgres.yml)
    active: ${APP_PROFILE:h2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

# Application-specific, fully configurable settings (bound to AppProperties)
app:
  api:
    # Base path prefix for every REST endpoint - change once, applies everywhere
    base-path: ${API_BASE_PATH:/api/v1}
  cors:
    # Comma-separated list of allowed frontend origins
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  pagination:
    default-page-size: ${PAGE_SIZE_DEFAULT:20}
    max-page-size: ${PAGE_SIZE_MAX:200}
  seed:
    # Seed reference/demo data on startup when tables are empty
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.arcad.atumerlin: ${LOG_LEVEL:INFO}
